<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros - Contacto y Cotización</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Ferretería Los Maestros</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto / Cotizar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Solicitud de Cotización o Consulta</h2>
            <p>Contratistas y particulares pueden enviar sus dudas o lista de materiales aquí:</p>
            
            <form id="formContacto">
                <div>
                    <label for="tipoCliente">Tipo de Cliente:</label>
                    <select id="tipoCliente" name="tipoCliente">
                        <option value="particular">Particular</option>
                        <option value="contratista">Contratista / Maestro de Obra</option>
                    </select>
                </div>

                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej. Juan Pérez">
                </div>

                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" placeholder="ejemplo@correo.com">
                </div>

                <div>
                    <label for="telefono">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="+56 9 1234 5678">
                </div>

                <div>
                    <label for="mensaje">Detalle de Materiales o Consulta:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Indica los materiales, cantidades o consultas sobre stock..."></textarea>
                </div>

                <button type="submit">Enviar Solicitud</button>
            </form>

            <!-- Mensajes de estado cargados desde JavaScript -->
            <p id="mensajeEstado" class="mensaje-estado"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Ferretería Los Maestros - La Serena, Región de Coquimbo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
